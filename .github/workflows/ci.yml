name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, x64]

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        working-directory: compiler
        run: npm ci

      - name: Build
        working-directory: compiler
        run: npm run build

      - name: Test
        working-directory: compiler
        run: npm test