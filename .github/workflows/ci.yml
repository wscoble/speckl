name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, x64]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: compiler/package-lock.json

      - name: Install dependencies
        working-directory: compiler
        run: npm ci

      - name: Build
        working-directory: compiler
        run: npm run build

      - name: Test
        working-directory: compiler
        run: npm test