<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#3b82f6">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
  </defs>

  <!-- Content Entry -->
  <rect x="125" y="10" width="250" height="55" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="250" y="34" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Content Entry</text>
  <text x="250" y="52" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">book, essay, workshop</text>

  <!-- Arrow: Content Entry → First Call -->
  <line x1="250" y1="65" x2="250" y2="95" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- First Call -->
  <rect x="100" y="100" width="300" height="55" rx="8" fill="#1e3a5f" stroke="#f59e0b" stroke-width="2"/>
  <text x="250" y="124" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">First Call</text>
  <text x="250" y="142" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11">"What do you do?" → 1-liner</text>

  <!-- Arrow: First Call → Package 1 -->
  <line x1="250" y1="155" x2="250" y2="185" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Package 1: Assessment -->
  <rect x="100" y="190" width="300" height="55" rx="8" fill="#1e3a5f" stroke="#10b981" stroke-width="2"/>
  <text x="250" y="214" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Package 1: Assessment</text>
  <text x="250" y="232" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">$5K – $10K</text>

  <!-- Arrow: Package 1 → split point -->
  <line x1="250" y1="245" x2="250" y2="270" stroke="#3b82f6" stroke-width="2"/>
  <!-- Horizontal split line -->
  <line x1="85" y1="270" x2="415" y2="270" stroke="#3b82f6" stroke-width="2"/>
  <!-- Down to Package 2 -->
  <line x1="85" y1="270" x2="85" y2="300" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Down to Package 3 -->
  <line x1="250" y1="270" x2="250" y2="300" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Down to Both -->
  <line x1="415" y1="270" x2="415" y2="300" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Package 2: Speckl -->
  <rect x="10" y="305" width="150" height="70" rx="8" fill="#1e3a5f" stroke="#8b5cf6" stroke-width="2"/>
  <text x="85" y="333" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Package 2</text>
  <text x="85" y="353" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="12">Speckl</text>
  <text x="85" y="369" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">$30K – $50K</text>

  <!-- Package 3: Fractional -->
  <rect x="175" y="305" width="150" height="70" rx="8" fill="#1e3a5f" stroke="#ec4899" stroke-width="2"/>
  <text x="250" y="333" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Package 3</text>
  <text x="250" y="353" text-anchor="middle" fill="#f9a8d4" font-family="system-ui, sans-serif" font-size="12">Fractional</text>
  <text x="250" y="369" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">$10K – $15K/mo</text>

  <!-- Both (P2 → P3) -->
  <rect x="340" y="305" width="150" height="70" rx="8" fill="#1e3a5f" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="415" y="333" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Both</text>
  <text x="415" y="353" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">P2 → P3</text>
  <text x="415" y="369" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Full engagement</text>
</svg>